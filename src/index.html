<!doctype html>
<html lang="en">
  {{>header}}
  <body class="bg-ink font-sans text-slate-200 antialiased">
    {{>navbar}}
    <main class="pt-16">
      {{>hero}}
      {{>portfolio}}
      {{>about}}
      {{>contact}}
    </main>
    {{>footer}}
    <button
      id="return-to-top"
      type="button"
      class="fixed right-5 bottom-5 z-40 hidden h-11 w-11 items-center justify-center rounded-full border border-line bg-panel text-muted shadow-lg transition-colors hover:text-white"
      aria-label="Back to top"
    >
      <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
